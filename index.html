        const Icon = ({ name, size = 24, className = "", strokeWidth = 2 }) => {
            const ref = useRef(null);

            useEffect(() => {
                const renderIcon = () => {
                    if (window.lucide && ref.current) {
                        ref.current.innerHTML = '';
                        const iconEl = document.createElement('i');
                        const lucideName = name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
                        iconEl.setAttribute('data-lucide', lucideName);
                        ref.current.appendChild(iconEl);
                        
                        window.lucide.createIcons({
                            attrs: { 
                                width: size, 
                                height: size, 
                                "stroke-width": strokeWidth,
                                class: className 
                            }
                        });
                        return true;
                    }
                    return false;
                };

                if (!renderIcon()) {
                    const interval = setInterval(() => {
                        if (renderIcon()) clearInterval(interval);
                    }, 50);
                    return () => clearInterval(interval);
                }
            }, [name, size, className, strokeWidth]);

            return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} />;
        };

                    <div className="ml-5 text-left flex-1">
                        <h4 className="font-bold text-[15px] text-stone-900 leading-tight">{title}</h4>
                        <p className="text-xs text-stone-500 mt-1">{subtitle}</p>
                    </div>
                    <Icon name="ChevronRight" size={18} className="text-stone-300" />
                </button>
            );

            const SectionTitle = ({ title, subtitle }) => (
                <div className="mb-8 px-2">
                    <h2 className="font-serif text-3xl text-[#064e3b] leading-tight italic">{title}</h2>
                    {subtitle && <p className="text-[10px] font-bold uppercase tracking-[0.2em] text-stone-400 mt-2">{subtitle}</p>}
                </div>
            );

            const renderHome = () => (
                <div className="fade-in pb-32">
                    <div className="relative h-[45vh] bg-stone-200 overflow-hidden">
                        <img 
                            src="https://bordigherasuite.com/wp-content/uploads/2023/04/IMG_6744-scaled.jpg" 
                            alt="Bordighera Suite Apartments" 
                            className="w-full h-full object-cover"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/10 to-transparent" />
                        
                        {/* Persistent Language Switcher on Home */}
                        <div className="absolute top-6 left-0 right-0 flex justify-center z-20">
                            <LanguageSwitcher />
                        </div>

                        <div className="absolute inset-0 flex flex-col justify-end p-8 pb-12">
                            <p className="text-white/80 text-[11px] font-bold uppercase tracking-[0.35em] mb-2">{t.welcome}</p>
                            <h1 className="text-white font-serif text-4xl font-light text-shadow-strong leading-[1.15] italic">{t.heroTitle}</h1>
                        </div>
                    </div>

                    <div className="p-6 -mt-8 relative z-10 bg-[#fdfcf8] rounded-t-[40px]">
                        <SectionTitle title={t.stay} subtitle={t.services} />
                        
                        <div className="space-y-1">
                            <ActionCard iconName="Key" title={t.access} subtitle={t.accessSub} onClick={() => setActiveTab('access-detail')} />
                            <ActionCard iconName="Wifi" title={t.wifi} subtitle={t.wifiSub} onClick={() => setActiveTab('wifi-detail')} />
                            <ActionCard iconName="Trash2" title={t.waste} subtitle={t.wasteSub} onClick={() => setActiveTab('waste-detail')} />
                            <ActionCard iconName="PlusCircle" title={t.extra} subtitle={t.extraSub} onClick={() => setActiveTab('extra-detail')} />
                            <ActionCard iconName="Clock" title={t.checkout} subtitle={t.checkoutSub} onClick={() => setActiveTab('checkout-detail')} />
                        </div>
                    </div>
                </div>
            );

            const renderChat = () => (
                <div className="flex flex-col h-screen bg-white overflow-hidden">
                    <div className="p-6 bg-white border-b border-stone-100 pt-16 shadow-sm text-center">
                        <h2 className="font-serif text-2xl text-[#064e3b]">{t.aiTitle}</h2>
                        <p className="text-[10px] text-stone-400 font-bold uppercase tracking-widest mt-1">{t.aiSub}</p>
                    </div>
                    {/* Added pb-[100px] to ensure the chat input is visible above the bottom navbar */}
                    <div className="flex-1 bg-stone-50 overflow-hidden pb-[100px]">
                        <iframe 
                            src={tawkChatUrl} 
                            className="w-full h-full border-none"
                            title="Concierge Chat"
                        ></iframe>
                    </div>
                </div>
            );

            const renderSubPage = (content) => (
                <div className="p-6 pt-16 pb-32 fade-in min-h-screen">
                    <div className="flex justify-between items-center mb-8">
                        <button 
                            onClick={() => setActiveTab('stays')}
                            className="flex items-center gap-2 px-5 py-3 bg-white rounded-2xl border border-stone-100 shadow-sm text-[#064e3b] active:scale-95 transition-all"
                        >
                            <Icon name="ArrowLeft" size={18} /> 
                            <span className="font-bold text-xs uppercase tracking-wider">{t.back}</span>
                        </button>
                        
                        {/* Minified Lang Switcher for Subpages */}
                        <div className="flex gap-1">
                            {languages.map(l => (
                                <button 
                                    key={l.id} 
                                    onClick={() => setLang(l.id)}
                                    className={`w-8 h-8 rounded-full flex items-center justify-center text-xs transition-all ${lang === l.id ? 'bg-[#064e3b] text-white shadow-md' : 'bg-white border border-stone-100 text-stone-400'}`}
                                >
                                    {l.label}
                                </button>
                            ))}
                        </div>
                    </div>
                    {content}
                </div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen relative bg-[#fdfcf8] overflow-x-hidden">
                    <main>
                        {activeTab === 'stays' && renderHome()}
                        {activeTab === 'chat' && renderChat()}
                        
                        {activeTab === 'access-detail' && renderSubPage(
                            <div className="space-y-8 text-stone-800">
                                <SectionTitle title={t.access} subtitle="Check-in" />
                                
                                <div className="bg-[#064e3b]/5 p-6 rounded-[32px] border border-[#064e3b]/10 space-y-4">
                                    <div className="flex items-center gap-3 text-[#064e3b]">
                                        <Icon name="Info" size={20} />
                                        <h3 className="font-bold text-sm uppercase tracking-wider">{t.important}</h3>
                                    </div>
                                    <p className="text-sm leading-relaxed text-stone-600 italic">
                                        {t.accessInfo}
                                    </p>
                                </div>

                                <div className="space-y-6">
                                    <div className="p-6 bg-white rounded-[32px] border border-stone-100 shadow-sm space-y-4">
                                        <div className="flex items-center gap-4">
                                            <div className="w-8 h-8 bg-stone-100 rounded-full flex items-center justify-center font-bold text-[#064e3b]">1</div>
                                            <h3 className="font-bold">{t.doorMain}</h3>
                                        </div>
                                        <p className="text-sm text-stone-500 ml-12">{t.doorMainInfo}</p>
                                    </div>

                                    <div className="p-6 bg-white rounded-[32px] border border-stone-100 shadow-sm space-y-6">
                                        <div className="flex items-center gap-4">
                                            <div className="w-8 h-8 bg-stone-100 rounded-full flex items-center justify-center font-bold text-[#064e3b]">2</div>
                                            <h3 className="font-bold">{t.doorApp}</h3>
                                        </div>
                                        
                                        <div className="space-y-4 ml-12">
                                            <div className="space-y-2">
                                                <h4 className="text-xs font-bold uppercase text-stone-400 tracking-widest">{t.optA}</h4>
                                                <ul className="text-sm space-y-2 text-stone-600">
                                                    <li className="flex gap-2"><Icon name="CheckCircle" size={14} className="text-green-600 mt-0.5 shrink-0" /> {t.lockbox1}</li>
                                                    <li className="flex gap-2"><Icon name="CheckCircle" size={14} className="text-green-600 mt-0.5 shrink-0" /> {t.lockbox2}</li>
                                                    <li className="flex gap-2"><Icon name="CheckCircle" size={14} className="text-green-600 mt-0.5 shrink-0" /> {t.lockbox3}</li>
                                                </ul>
                                            </div>

                                            <div className="space-y-2">
                                                <h4 className="text-xs font-bold uppercase text-stone-400 tracking-widest">{t.optB}</h4>
                                                <ul className="text-sm space-y-2 text-stone-600">
                                                    <li className="flex gap-2"><Icon name="CheckCircle" size={14} className="text-green-600 mt-0.5 shrink-0" /> {t.smart1}</li>
                                                    <li className="flex gap-2"><Icon name="CheckCircle" size={14} className="text-green-600 mt-0.5 shrink-0" /> {t.smart2}</li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <h3 className="font-serif text-xl px-2">{t.videoTutorial}</h3>
                                    <div className="video-container shadow-xl">
                                        <video controls poster="https://bordigherasuite.com/wp-content/uploads/2023/04/IMG_6744-scaled.jpg">
                                            <source src="https://bordigherasuite.com/wp-content/uploads/2026/03/Check-in-1.1-720.mp4" type="video/mp4" />
                                            {t.videoError}
                                        </video>
                                    </div>
                                </div>
                                
                                <div className="p-4 bg-stone-100 rounded-2xl italic text-[11px] text-stone-500 text-center">
                                    {t.lockboxHint}
                                </div>
                            </div>
                        )}

                        {activeTab === 'wifi-detail' && renderSubPage(
                            <div className="space-y-6">
                                <SectionTitle title={t.wifi} subtitle="Network" />
                                <div className="bg-white p-8 rounded-[40px] border border-stone-100 shadow-sm text-center">
                                    <div className="space-y-2 mb-8">
                                        <p className="text-[10px] font-bold text-stone-400 uppercase tracking-widest mb-4">{t.selectNet}</p>
                                        <div className="grid grid-cols-1 gap-2">
                                            {wifiNetworks.map(net => (
                                                <div key={net} className="flex items-center justify-between p-3 bg-stone-50 rounded-xl text-xs font-medium">
                                                    <span>{net}</span>
                                                    <Icon name="Check" size={14} className="text-green-600" />
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="pt-6 border-t border-stone-100">
                                        <p className="text-[10px] font-bold text-stone-400 uppercase tracking-widest mb-3">{t.unifiedPass}</p>
                                        <div className="flex justify-between items-center p-5 bg-[#064e3b]/5 rounded-2xl border border-[#064e3b]/10">
                                            <span className="font-mono font-bold text-xl text-[#064e3b]">{wifiPassword}</span>
                                            <button onClick={() => copyToClipboard(wifiPassword)} className="p-3 bg-white rounded-xl shadow-sm active:scale-90 transition-all">
                                                <Icon name="Copy" size={20} className={copySuccess ? "text-green-600" : "text-[#064e3b]"} />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'waste-detail' && renderSubPage(
                            <div className="space-y-8 text-stone-700 pb-10">
                                <SectionTitle title={t.waste} subtitle={t.wasteTitle} />
                                
                                <div className="bg-white rounded-[40px] border border-stone-100 shadow-sm overflow-hidden">
                                    <img src="https://bordigherasuite.com/wp-content/uploads/2024/06/raccolta-differenziata-cucina.avif" className="w-full h-48 object-cover" />
                                    <div className="p-8 space-y-6">
                                        <div className="space-y-2">
                                            <h3 className="font-bold text-lg text-stone-900 leading-tight">{t.wasteIntro}</h3>
                                            <p className="text-sm text-stone-500 leading-relaxed italic">{t.wasteEco}</p>
                                        </div>
                                        <p className="text-sm leading-relaxed">{t.wasteLoc}</p>
                                        <div className="space-y-3">
                                            {t.wasteItems.map(item => (
                                                <div key={item} className="flex items-center gap-3 p-3 bg-stone-50 rounded-2xl text-[11px] font-bold uppercase tracking-wider text-stone-600">
                                                    <div className="w-2 h-2 rounded-full bg-[#064e3b]" />
                                                    {item}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-[#064e3b] text-white p-8 rounded-[40px] shadow-lg space-y-4">
                                    <div className="flex items-center gap-3">
                                        <Icon name="QrCode" size={24} className="text-stone-200" />
                                        <h3 className="font-bold text-sm uppercase tracking-[0.15em]">{t.qrTitle}</h3>
                                    </div>
                                    <p className="text-sm leading-relaxed opacity-90">{t.qrInfo}</p>
                                    <button 
                                        onClick={() => triggerAction('link', qrCodeLink, t.qrTitle, t.modalQrMsg)}
                                        className="w-full py-4 bg-white text-[#064e3b] rounded-2xl font-bold text-xs uppercase tracking-widest flex items-center justify-center gap-2 shadow-sm"
                                    >
                                        <Icon name="ExternalLink" size={14} /> {t.qrBtn}
                                    </button>
                                </div>

                                <div className="bg-white rounded-[40px] border border-stone-100 shadow-sm overflow-hidden text-stone-800 text-center">
                                    <img src="https://bordigherasuite.com/wp-content/uploads/2024/06/20240604_163608-768x1024.jpg" className="w-full h-64 object-cover" />
                                    <div className="p-8 space-y-6">
                                        <div className="space-y-2">
                                            <h3 className="font-bold text-lg text-stone-900 leading-tight">{t.ecoPos}</h3>
                                            <p className="text-xs text-stone-400">{t.ecoPosSub}</p>
                                        </div>
                                        <div className="w-full h-48 rounded-[32px] overflow-hidden shadow-inner bg-stone-100">
                                            <iframe src="https://maps.google.com/maps?q=43.7829802884844,7.656043608039313&z=17&output=embed" className="w-full h-full border-none"></iframe>
                                        </div>
                                        <button 
                                            onClick={() => triggerAction('maps', "https://maps.app.goo.gl/2jsAx6V44kBaY3Hd9", t.ecoPos, t.modalMapsMsg)} 
                                            className="w-full py-4 bg-[#064e3b] text-white rounded-[24px] font-bold shadow-lg active:scale-95 transition-all uppercase tracking-wider text-xs flex items-center justify-center gap-2"
                                        >
                                            <Icon name="Map" size={16} /> {t.mapsBtn}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'extra-detail' && renderSubPage(
                            <div className="space-y-6">
                                <SectionTitle title={t.extra} subtitle="Hotel Amenities" />
                                <div className="bg-white p-8 rounded-[40px] border border-stone-100 shadow-sm space-y-6">
                                    <div className="grid grid-cols-1 gap-3 text-sm">
                                        {t.extraItems.map(item => (
                                            <div key={item} className="flex items-center gap-3 p-4 bg-stone-50 rounded-2xl font-medium">
                                                <Icon name="CheckCircle2" size={18} className="text-[#064e3b]" /> {item}
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => triggerAction('whatsapp', `https://wa.me/${staffPhoneNumber}`, t.extra, t.modalStaffMsg)} className="w-full py-5 bg-[#064e3b] text-white rounded-3xl font-bold flex items-center justify-center gap-3 shadow-lg active:scale-95 transition-all">
                                        {t.extraBtn}
                                    </button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'checkout-detail' && renderSubPage(
                            <div className="space-y-6">
                                <SectionTitle title={t.checkout} subtitle={t.coTitle} />
                                <div className="bg-white p-8 rounded-[40px] border border-stone-100 shadow-sm space-y-8 text-stone-700">
                                    <div className="space-y-8 text-sm">
                                        <div className="flex gap-4 p-4 bg-stone-50 rounded-2xl items-start">
                                            <Icon name="Clock" className="text-[#064e3b] shrink-0 mt-0.5" /> 
                                            <p className="font-medium">{t.coTime}</p>
                                        </div>
                                        <div className="flex gap-4 p-4 bg-stone-50 rounded-2xl items-start">
                                            <Icon name="Briefcase" className="text-[#064e3b] shrink-0 mt-0.5" /> 
                                            <p className="font-medium">{t.coLuggage}</p>
                                        </div>
                                        <div className="flex gap-4 p-4 bg-stone-50 rounded-2xl items-start">
                                            <Icon name="Key" className="text-[#064e3b] shrink-0 mt-0.5" /> 
                                            <p className="font-medium">{t.coKeys}</p>
                                        </div>
                                    </div>
                                    <div className="pt-4">
                                        <button onClick={() => setShowReviewModal(true)} className="w-full py-5 bg-[#064e3b] text-white rounded-3xl font-bold shadow-xl active:scale-95 transition-all">{t.reviewBtn}</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Navbar */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-nav border-t border-stone-100 px-6 pt-4 pb-10 flex justify-around items-center z-[100] shadow-[0_-10px_30px_rgba(0,0,0,0.03)]">
                        <button onClick={() => setActiveTab('stays')} className={`flex flex-col items-center gap-2 transition-colors ${['stays', 'wifi-detail', 'waste-detail', 'extra-detail', 'checkout-detail', 'access-detail'].includes(activeTab) ? 'text-[#064e3b]' : 'text-stone-300'}`}>
                            <Icon name="Home" size={24} />
                            <span className="text-[9px] font-bold uppercase tracking-widest">{t.navStay}</span>
                        </button>
                        <button onClick={() => setActiveTab('chat')} className={`flex flex-col items-center gap-2 transition-colors ${activeTab === 'chat' ? 'text-[#064e3b]' : 'text-stone-300'}`}>
                            <Icon name="Bot" size={24} />
                            <span className="text-[9px] font-bold uppercase tracking-widest">{t.navAi}</span>
                        </button>
                        <button onClick={() => triggerAction('whatsapp', `https://wa.me/${staffPhoneNumber}`, t.navStaff, t.modalStaffMsg)} className="flex flex-col items-center gap-2 text-stone-300 active:text-[#064e3b]">
                            <Icon name="MessageCircle" size={24} />
                            <span className="text-[9px] font-bold uppercase tracking-widest">{t.navStaff}</span>
                        </button>
                    </nav>

                    {/* External Link Modal */}
                    {externalModal.show && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm fade-in">
                            <div className="bg-white rounded-[40px] p-8 w-full max-w-xs shadow-2xl text-center">
                                <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6 ${externalModal.type === 'maps' ? 'bg-blue-50 text-blue-600' : 'bg-green-50 text-green-600'}`}>
                                    <Icon name={externalModal.type === 'maps' ? "Map" : externalModal.type === 'link' ? "ExternalLink" : "MessageCircle"} size={32} />
                                </div>
                                <h3 className="font-serif text-2xl text-[#064e3b] mb-2">{externalModal.title}</h3>
                                <p className="text-stone-500 text-sm mb-8 leading-relaxed italic">{externalModal.message}</p>
                                <div className="space-y-3">
                                    <button onClick={confirmExternal} className="w-full py-4 bg-[#064e3b] text-white rounded-2xl font-bold shadow-lg">{t.modalConfirm}</button>
                                    <button onClick={() => setExternalModal({ ...externalModal, show: false })} className="w-full py-4 text-stone-400 font-bold uppercase text-[10px] tracking-widest">{t.modalClose}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Review Modal */}
                    {showReviewModal && (
                        <div className="fixed inset-0 z-[210] flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm fade-in">
                            <div className="bg-white rounded-[40px] p-8 w-full max-w-sm shadow-2xl text-center space-y-6">
                                <h3 className="font-serif text-3xl text-[#064e3b] italic">{t.reviewTitle}</h3>
                                <div className="flex justify-center gap-1 text-amber-400 text-3xl py-4">★★★★★</div>
                                <button onClick={() => window.open(googleReviewUrl, '_blank')} className="w-full py-5 bg-[#064e3b] text-white rounded-3xl font-bold shadow-lg flex items-center justify-center gap-2">
                                    <Icon name="Star" size={18} /> {t.reviewFive}
                                </button>
                                <button onClick={() => setShowReviewModal(false)} className="text-stone-400 text-xs font-bold uppercase tracking-widest">{t.reviewLater}</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

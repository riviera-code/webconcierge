<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bordighera Suite Apartments - Web Concierge</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons Core -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .font-serif { font-family: 'Playfair Display', serif; }
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #fdfcf8; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom styles for icon containers to ensure correct sizing */
        .icon-wrapper svg { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        /**
         * Componente Icon corretto per l'uso con Lucide CDN
         * Converte i nomi CamelCase in kebab-case per mappare le icone di sistema
         */
        const Icon = ({ name, size = 24, className = "", strokeWidth = 2 }) => {
            const iconRef = useRef(null);

            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = '';
                    // Mappa i nomi comuni usati in lucide-react ai nomi della libreria core
                    const iconName = name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
                    const icon = window.lucide.icons[iconName] || window.lucide.icons[name.toLowerCase()];
                    
                    if (icon) {
                        const svg = icon.toSvg({
                            width: size,
                            height: size,
                            class: className,
                            'stroke-width': strokeWidth
                        });
                        iconRef.current.innerHTML = svg;
                    }
                }
            }, [name, size, className, strokeWidth]);

            return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`} style={{ width: size, height: size }}></span>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('stays');
            const [copySuccess, setCopySuccess] = useState(false);
            const [messages, setMessages] = useState([
                { role: 'assistant', text: 'Benvenuto a Bordighera Suite Apartments. Sono il tuo concierge virtuale. Come posso rendere perfetto il tuo soggiorno?' }
            ]);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const scrollRef = useRef(null);

            const staffPhoneNumber = "393891131311";
            const apiKey = ""; // Inizializzato vuoto come richiesto

            const apartmentsData = {
                "business": {
                    "name": "Bordighera Suite Apartments",
                    "whatsapp": "393891131311"
                },
                "wifi": {
                    "password": "Carducci37c"
                }
            };

            useEffect(() => {
                if (scrollRef.current) {
                    scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
                }
            }, [messages, isLoading]);

            const copyToClipboard = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setCopySuccess(true);
                    setTimeout(() => setCopySuccess(false), 2000);
                } catch (err) {
                    console.error('Copy error', err);
                }
                document.body.removeChild(textArea);
            };

            const askGemini = async (userText) => {
                const systemInstruction = `Sei il Concierge Digitale di 'Bordighera Suite Apartments'. Usa un tono elegante, sofisticato e professionale. 
                Info Wi-Fi: Password "${apartmentsData.wifi.password}". Check-out: ore 10:30. Contatto WhatsApp Staff: +${staffPhoneNumber}. 
                Messaggio per accessori: Spiega che per ragioni di spazio e ordine forniamo Tostapane, Microonde, Aspirapolvere, Ferro e Asse da stiro su richiesta tramite WhatsApp.`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userText }] }],
                            systemInstruction: { parts: [{ text: systemInstruction }] }
                        })
                    });
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "Mi scusi, sto riscontrando un problema. Può contattare lo staff su WhatsApp.";
                } catch (error) {
                    return "Spiacente, contatta lo staff su WhatsApp per assistenza immediata.";
                }
            };

            const handleSendMessage = async (e) => {
                e.preventDefault();
                if (!input.trim() || isLoading) return;
                const userMsg = input;
                setInput('');
                setMessages(prev => [...prev, { role: 'user', text: userMsg }]);
                setIsLoading(true);
                const response = await askGemini(userMsg);
                setMessages(prev => [...prev, { role: 'assistant', text: response }]);
                setIsLoading(false);
            };

            const ActionCard = ({ iconName, title, subtitle, onClick }) => (
                <button 
                    onClick={onClick}
                    className="w-full flex items-center p-5 bg-white rounded-[24px] border border-stone-100 shadow-sm hover:shadow-md transition-all group active:scale-[0.98] mb-4"
                >
                    <div className="p-3 bg-stone-50 rounded-2xl text-[#064e3b] group-hover:bg-[#064e3b] group-hover:text-white transition-colors">
                        <Icon name={iconName} size={24} />
                    </div>
                    <div className="ml-5 text-left flex-1">
                        <h4 className="font-bold text-[15px] text-stone-900">{title}</h4>
                        <p className="text-xs text-stone-500 mt-0.5">{subtitle}</p>
                    </div>
                    <Icon name="ChevronRight" size={18} className="text-stone-300" />
                </button>
            );

            const renderStays = () => (
                <div className="pb-32 fade-in overflow-x-hidden">
                    <div className="relative h-80 bg-stone-200 overflow-hidden">
                        <img 
                            src="https://bordigherasuite.com/wp-content/uploads/2023/04/IMG_6744-scaled.jpg" 
                            alt="Bordighera Suite Interior" 
                            className="w-full h-full object-cover"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-[#fdfcf8] via-black/10 to-transparent" />
                        <div className="absolute inset-0 flex flex-col justify-end p-8">
                            <h1 className="text-white font-serif text-3xl font-light drop-shadow-md">Bordighera Suite Apartments</h1>
                            <p className="text-stone-100 text-sm mt-1 drop-shadow-sm font-medium uppercase tracking-wider">Quality Apartments in Bordighera</p>
                        </div>
                    </div>

                    <div className="p-6">
                        <div className="mb-10 px-2">
                           <h3 className="font-serif text-2xl text-[#064e3b] mb-3">Benvenuti a Casa</h3>
                           <p className="text-sm text-stone-600 leading-relaxed">
                              Siamo felici di avervi come nostri ospiti. Qui troverete tutto il necessario per gestire il vostro soggiorno con facilità ed eleganza.
                           </p>
                        </div>
                        
                        <h3 className="text-[11px] font-bold uppercase tracking-[0.2em] text-stone-400 mb-6 px-2">SERVIZI IN APPARTAMENTO</h3>
                        
                        <div className="space-y-1">
                            <ActionCard iconName="Wifi" title="Connessione Wi-Fi" subtitle="Reti e password unificata" onClick={() => setActiveTab('wifi-detail')} />
                            <ActionCard iconName="Trash2" title="Raccolta Rifiuti" subtitle="Guida alla differenziata locale" onClick={() => setActiveTab('waste-detail')} />
                            <ActionCard iconName="PlusCircle" title="Accessori Extra" subtitle="Tostapane, microonde e altro su richiesta" onClick={() => setActiveTab('extra-detail')} />
                            <ActionCard iconName="Clock" title="Procedura Check-out" subtitle="Istruzioni per la partenza alle 10:30" onClick={() => setActiveTab('checkout-detail')} />
                        </div>
                    </div>
                </div>
            );

            const renderExplore = () => (
                <div className="p-6 pb-32 fade-in">
                    <h1 className="font-serif text-4xl text-[#064e3b] mt-12 mb-2 font-light">Explore</h1>
                    <p className="text-stone-400 text-sm mb-10 uppercase tracking-widest font-bold text-[10px]">Scopri Bordighera</p>
                    <div className="space-y-10">
                        <div className="relative h-64 rounded-[40px] overflow-hidden shadow-lg">
                            <img src="https://images.unsplash.com/photo-1533105079780-92b9be482077?w=600" className="w-full h-full object-cover" />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent p-8 flex flex-col justify-end">
                                <span className="text-xs font-bold text-white/70 tracking-widest uppercase mb-1">IL BORGO</span>
                                <h4 className="text-white font-serif text-2xl">Bordighera Alta</h4>
                            </div>
                        </div>
                        <div className="relative h-64 rounded-[40px] overflow-hidden shadow-lg">
                            <img src="https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?w=600" className="w-full h-full object-cover" />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent p-8 flex flex-col justify-end">
                                <span className="text-xs font-bold text-white/70 tracking-widest uppercase mb-1">NATURA</span>
                                <h4 className="text-white font-serif text-2xl">Giardino Pallanca</h4>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const renderChat = () => (
                <div className="flex flex-col h-screen bg-stone-50">
                    <div className="p-6 bg-white border-b border-stone-100 pt-16">
                        <h2 className="font-serif text-2xl text-[#064e3b]">Concierge AI</h2>
                        <p className="text-xs text-stone-400 font-bold uppercase tracking-widest">Servizio attivo</p>
                    </div>
                    <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-4">
                        {messages.map((msg, i) => (
                            <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-4 rounded-[24px] text-sm ${msg.role === 'user' ? 'bg-[#064e3b] text-white rounded-tr-none' : 'bg-white text-stone-800 border border-stone-100 rounded-tl-none'}`}>
                                    {msg.text}
                                </div>
                            </div>
                        ))}
                        {isLoading && <div className="p-4 bg-white rounded-2xl w-fit border border-stone-100 flex items-center gap-2 text-xs text-stone-400 italic"><Icon name="Loader" size={14} className="animate-spin" /> L'assistente sta scrivendo...</div>}
                    </div>
                    <div className="p-4 pb-32 bg-white border-t border-stone-100">
                        <form onSubmit={handleSendMessage} className="flex gap-2">
                            <input type="text" value={input} onChange={(e) => setInput(e.target.value)} placeholder="Chiedimi della casa..." className="flex-1 bg-stone-50 border border-stone-200 rounded-full px-6 py-4 text-sm focus:ring-1 focus:ring-[#064e3b] outline-none" />
                            <button type="submit" disabled={!input.trim() || isLoading} className="bg-[#064e3b] text-white p-4 rounded-full shadow-lg"><Icon name="Send" size={20} /></button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen relative shadow-2xl overflow-hidden bg-[#fdfcf8]">
                    <main>
                        {activeTab === 'stays' && renderStays()}
                        {activeTab === 'explore' && renderExplore()}
                        {activeTab === 'chat' && renderChat()}
                        
                        {['wifi-detail', 'waste-detail', 'extra-detail', 'checkout-detail'].includes(activeTab) && (
                            <div className="p-6 pt-12 pb-32 fade-in min-h-screen">
                                <button onClick={() => setActiveTab('stays')} className="flex items-center text-[#064e3b] font-bold mb-10 bg-stone-50 px-4 py-2 rounded-full w-fit">
                                    <Icon name="ChevronLeft" size={18} className="mr-2" /> Indietro
                                </button>
                                {activeTab === 'wifi-detail' && (
                                    <div className="space-y-6">
                                        <h2 className="font-serif text-3xl text-[#064e3b]">Wi-Fi</h2>
                                        <div className="bg-white p-8 rounded-[32px] border border-stone-100 shadow-sm space-y-6">
                                            <p className="text-[10px] font-bold text-stone-400 uppercase tracking-widest">Password unificata</p>
                                            <div className="flex justify-between items-center p-6 bg-[#fdfcf8] rounded-2xl border border-stone-100">
                                                <span className="font-mono font-bold text-xl text-[#064e3b]">{apartmentsData.wifi.password}</span>
                                                <button onClick={() => copyToClipboard(apartmentsData.wifi.password)} className="p-3 bg-white rounded-xl shadow-sm"><Icon name="Copy" size={20} className={copySuccess ? "text-green-600" : "text-[#064e3b]"} /></button>
                                            </div>
                                            <p className="text-xs text-stone-400 italic leading-relaxed">Fibra ottica ad alta velocità disponibile in tutto il palazzo.</p>
                                        </div>
                                    </div>
                                )}
                                {activeTab === 'waste-detail' && (
                                    <div className="space-y-6">
                                        <h2 className="font-serif text-3xl text-[#064e3b]">Rifiuti</h2>
                                        <div className="space-y-3">
                                            {['Carta (Blu)', 'Plastica (Giallo)', 'Vetro (Verde)', 'Organico (Marrone)', 'Indifferenziato (Grigio)'].map(item => (
                                                <div key={item} className="p-5 bg-white border border-stone-100 rounded-[24px] flex items-center gap-4 shadow-sm">
                                                    <Icon name="Trash2" size={20} className="text-[#064e3b]" />
                                                    <span className="font-medium text-sm text-stone-700">{item}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                {activeTab === 'extra-detail' && (
                                    <div className="space-y-6">
                                        <h2 className="font-serif text-3xl text-[#064e3b]">Accessori Extra</h2>
                                        <div className="bg-white p-8 rounded-[40px] border border-stone-100 shadow-sm space-y-6">
                                            <p className="text-sm text-stone-600 italic leading-relaxed">Forniamo questi accessori solo su richiesta degli ospiti per ragioni di spazio e ordine negli appartamenti.</p>
                                            {['Tostapane', 'Microonde', 'Ferro da stiro', 'Aspirapolvere'].map(item => (
                                                <div key={item} className="flex items-center gap-4 p-4 bg-stone-50/50 rounded-2xl text-sm font-medium text-stone-700">
                                                    <Icon name="CheckCircle2" size={18} className="text-[#064e3b]" />
                                                    {item}
                                                </div>
                                            ))}
                                            <button onClick={() => window.open(`https://wa.me/${staffPhoneNumber}?text=Buongiorno,%20è%20possibile%20avere%20degli%20accessori%20extra?`)} className="w-full py-5 bg-[#25D366] text-white rounded-[24px] font-bold flex items-center justify-center gap-3 shadow-lg">
                                                <Icon name="Phone" size={20} /> Richiedi ora su WhatsApp
                                            </button>
                                        </div>
                                    </div>
                                )}
                                {activeTab === 'checkout-detail' && (
                                    <div className="space-y-6">
                                        <h2 className="font-serif text-3xl text-[#064e3b]">Check-out</h2>
                                        <div className="bg-white p-8 rounded-[40px] border border-stone-100 shadow-sm space-y-8">
                                            <div className="space-y-6 text-stone-700">
                                                <div className="flex gap-5">
                                                    <Icon name="Clock" size={24} className="text-[#064e3b] mt-1" />
                                                    <div><p className="font-bold">Entro le 10:30</p><p className="text-xs text-stone-500">Per permettere le pulizie dell'appartamento.</p></div>
                                                </div>
                                                <div className="flex gap-5">
                                                    <Icon name="Sun" size={24} className="text-[#064e3b] mt-1" />
                                                    <div><p className="font-bold">Energia & Luci</p><p className="text-xs text-stone-500">Vi preghiamo di spegnere tutte le luci e l'aria condizionata.</p></div>
                                                </div>
                                                <div className="flex gap-5">
                                                    <Icon name="Key" size={24} className="text-[#064e3b] mt-1" />
                                                    <div><p className="font-bold">Consegna Chiavi</p><p className="text-xs text-stone-500">Lasciate le chiavi sul tavolo e chiudete la porta alle vostre spalle.</p></div>
                                                </div>
                                            </div>
                                            <button className="w-full py-5 bg-[#064e3b] text-white rounded-[24px] font-bold flex items-center justify-center gap-3 shadow-lg">
                                                <Icon name="ExternalLink" size={18} /> Lascia una recensione
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 backdrop-blur-xl border-t border-stone-100 px-6 pt-4 pb-10 flex justify-between items-center z-[100]">
                        <button onClick={() => setActiveTab('explore')} className={`flex flex-col items-center gap-2 ${activeTab === 'explore' ? 'text-[#064e3b]' : 'text-stone-300'}`}>
                            <Icon name="MapPin" size={24} strokeWidth={activeTab === 'explore' ? 2.5 : 2} />
                            <span className="text-[9px] font-bold uppercase tracking-widest">ESPLORA</span>
                        </button>
                        <button onClick={() => setActiveTab('stays')} className={`flex flex-col items-center gap-2 ${activeTab === 'stays' || (['wifi-detail', 'waste-detail', 'extra-detail', 'checkout-detail'].includes(activeTab) && activeTab !== 'chat') ? 'text-[#064e3b]' : 'text-stone-300'}`}>
                            <Icon name="BookOpen" size={24} strokeWidth={activeTab === 'stays' ? 2.5 : 2} />
                            <span className="text-[9px] font-bold uppercase tracking-widest">SOGGIORNO</span>
                        </button>
                        <button onClick={() => setActiveTab('chat')} className={`flex flex-col items-center gap-2 ${activeTab === 'chat' ? 'text-[#064e3b]' : 'text-stone-300'}`}>
                            <Icon name="MessageSquare" size={24} strokeWidth={activeTab === 'chat' ? 2.5 : 2} />
                            <span className="text-[9px] font-bold uppercase tracking-widest">CONCIERGE</span>
                        </button>
                        <button onClick={() => window.open(`https://wa.me/${staffPhoneNumber}`)} className="flex flex-col items-center gap-2 text-stone-300">
                            <Icon name="Phone" size={24} />
                            <span className="text-[9px] font-bold uppercase tracking-widest">STAFF</span>
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

        /**
         * Componente Icon con rendering isolato per nodo.
         * Risolve race-conditions e normalizza Trash2 -> trash-2.
         */
        const Icon = ({ name, size = 24, className = "", strokeWidth = 2 }) => {
            const ref = useRef(null);

            useEffect(() => {
                let isMounted = true;

                const render = () => {
                    if (!window.lucide || !ref.current || !isMounted) return false;

                    // Formatta correttamente: Trash2 -> trash-2, ArrowLeft -> arrow-left
                    const kebab = name
                        .replace(/([a-zA-Z])([0-9])/g, '$1-$2')
                        .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
                        .toLowerCase();

                    const pascal = name.charAt(0).toUpperCase() + name.slice(1);
                    const iconDef = window.lucide[pascal] || 
                                    (window.lucide.icons && (window.lucide.icons[pascal] || window.lucide.icons[kebab]));

                    // Se createElement è supportato, crea direttamente il nodo SVG
                    if (window.lucide.createElement && iconDef) {
                        try {
                            const svg = window.lucide.createElement(iconDef, {
                                width: size,
                                height: size,
                                'stroke-width': strokeWidth,
                                class: className
                            });
                            if (ref.current && isMounted) {
                                ref.current.innerHTML = '';
                                ref.current.appendChild(svg);
                                return true;
                            }
                        } catch (e) {}
                    }

                    // Fallback circoscritto ESCLUSIVAMENTE al nodo corrente
                    if (ref.current && isMounted) {
                        ref.current.innerHTML = `<i data-lucide="${kebab}"></i>`;
                        window.lucide.createIcons({
                            root: ref.current,
                            attrs: {
                                width: size,
                                height: size,
                                'stroke-width': strokeWidth,
                                class: className
                            }
                        });
                        return true;
                    }
                    return false;
                };

                if (!render()) {
                    const timer = setInterval(() => {
                        if (render()) clearInterval(timer);
                    }, 50);
                    return () => {
                        isMounted = false;
                        clearInterval(timer);
                    };
                }

                return () => {
                    isMounted = false;
                };
            }, [name, size, className, strokeWidth]);

            return (
                <span 
                    ref={ref} 
                    className={`inline-flex items-center justify-center shrink-0 ${className}`} 
                    style={{ width: size, height: size }} 
                />
            );
        };

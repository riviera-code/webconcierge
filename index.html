        const { useState, useEffect, useRef } = React;
        
        /**
         * Componente Icon Fixato (createIcons) - Massima stabilità
         */
        const Icon = ({ name, size = 24, className = "", strokeWidth = 2 }) => {
            const ref = useRef(null);

            useEffect(() => {
                const render = () => {
                    if (!window.lucide || !ref.current) return false;
                    const lucideName = name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
                    ref.current.innerHTML = `<i data-lucide="${lucideName}"></i>`;
                    window.lucide.createIcons({
                        attrs: { 
                            width: size, 
                            height: size, 
                            "stroke-width": strokeWidth,
                            class: className 
                        }
                    });
                    return true;
                };

                if (!render()) {
                    const t = setInterval(() => { if (render()) clearInterval(t); }, 50);
                    return () => clearInterval(t);
                }
            }, [name, size, strokeWidth, className]);

            return (
                <span
                    ref={ref}
                    className={`inline-flex items-center justify-center ${className}`}
                    style={{ width: size, height: size }}
                />
            );
        };

                                                <div className="p-6 bg-[#064e3b] text-white rounded-[32px] space-y-2">
                                                    <p className="text-[10px] font-bold uppercase tracking-[0.2em] opacity-80 text-center">Curiosità</p>
                                                    <p className="text-xs text-center leading-relaxed">
                                                        Bordighera è l'unico comune italiano autorizzato a fornire le palme al Vaticano per la Domenica delle Palme dal XVI secolo. Partono proprio da qui!
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'restaurants-detail' && (
                                    <div className="space-y-10 pb-10">
                                        <div className="px-2">
                                            <h2 className="font-serif text-3xl text-[#064e3b]">Bordighera</h2>
                                            <p className="text-stone-400 text-xs font-bold uppercase tracking-widest mt-1">Ristoranti Consigliati</p>
                                        </div>

                                        {restaurants.map((cat, idx) => (
                                            <div key={idx} className="space-y-4">
                                                <h3 className="flex items-center gap-2 font-serif text-xl text-stone-800 px-2">
                                                    <Icon name={cat.icon} size={20} className="text-[#064e3b]" />
                                                    {cat.category}
                                                </h3>
                                                <div className="space-y-4">
                                                    {cat.items.map((res, i) => (
                                                        <div key={i} className="bg-white rounded-[32px] p-6 border border-stone-100 shadow-sm space-y-4">
                                                            <div>
                                                                <h4 className="font-bold text-stone-900 text-lg leading-tight">{res.name}</h4>
                                                                <p className="text-xs text-[#064e3b] font-medium mt-1 italic leading-relaxed">"{res.comment}"</p>
                                                            </div>
                                                            <div className="pt-2 border-t border-stone-50 space-y-3">
                                                                <div className="flex items-start gap-2 text-[11px] text-stone-400 leading-tight">
                                                                    <Icon name="MapPin" size={14} className="shrink-0 mt-0.5" />
                                                                    <span>{res.address}</span>
                                                                </div>
                                                                <button 
                                                                    onClick={() => triggerMaps(res.maps, res.name)}
                                                                    className="w-full py-3 bg-stone-50 text-[#064e3b] rounded-2xl text-[11px] font-bold uppercase tracking-wider flex items-center justify-center gap-2 hover:bg-stone-100 transition-colors"
                                                                >
                                                                    <Icon name="Map" size={14} /> Vedi su Google Maps
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {activeTab === 'wifi-detail' && (
                                    <div className="space-y-6 text-stone-800">
                                        <h2 className="font-serif text-3xl text-[#064e3b]">Wi-Fi</h2>
                                        <div className="bg-white p-8 rounded-[32px] border border-stone-100 shadow-sm space-y-6 text-center">
                                            <div>
                                                <p className="text-[10px] font-bold text-stone-400 uppercase tracking-widest mb-4">Reti del Palazzo</p>
                                                <div className="grid grid-cols-1 gap-2 text-left sm:text-center">
                                                    {wifiNetworks.map(net => (
                                                        <div key={net} className="flex items-center gap-2 p-2 bg-stone-50/50 rounded-lg text-sm">
                                                            <Icon name="Check" size={14} className="text-green-600 shrink-0" />
                                                            {net}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="pt-4 border-t border-stone-100">
                                                <p className="text-[10px] font-bold text-stone-400 uppercase tracking-widest mb-2">Password unificata</p>
                                                <div className="flex justify-between items-center p-6 bg-[#fdfcf8] rounded-2xl border border-stone-100">
                                                    <span className="font-mono font-bold text-xl text-[#064e3b]">{wifiPassword}</span>
                                                    <button onClick={() => copyToClipboard(wifiPassword)} className="p-3 bg-white rounded-xl shadow-sm active:scale-90 transition-transform">
                                                        <Icon name="Copy" size={20} className={copySuccess ? "text-green-600" : "text-[#064e3b]"} />
                                                    </button>
                                                </div>
                                            </div>
                                            <p className="text-xs text-stone-400 italic">Connessione in fibra ottica gratuita ad alta velocità.</p>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'waste-detail' && (
                                    <div className="space-y-8 pb-10 text-stone-700">
                                        <h2 className="font-serif text-3xl text-[#064e3b]">Gestione Rifiuti</h2>
                                        
                                        <div className="bg-white rounded-[40px] border border-stone-100 shadow-sm overflow-hidden text-stone-800">
                                            <img src="https://bordigherasuite.com/wp-content/uploads/2024/06/raccolta-differenziata-cucina.avif" className="w-full h-48 object-cover" />
                                            <div className="p-8 space-y-4">
                                                <h3 className="font-bold text-lg text-stone-900 leading-tight">Separare i rifiuti domestici</h3>
                                                <p className="text-sm text-stone-500 leading-relaxed italic">Inizia la tua pratica eco-sostenibile durante il soggiorno.</p>
                                                <p className="text-sm leading-relaxed text-stone-600">I contenitori etichettati sono posizionati <b>sotto il lavello della cucina, in un angolo dedicato o sul terrazzo</b>:</p>
                                                <div className="grid grid-cols-2 gap-2 mt-4">
                                                    {['Plastica e lattine', 'Vetro', 'Carta', 'Organico', 'Indifferenziato'].map(item => (
                                                        <div key={item} className="flex items-center gap-2 p-2 bg-stone-50 rounded-xl text-[11px] font-bold uppercase tracking-tight text-stone-500">
                                                            <div className="w-1.5 h-1.5 rounded-full bg-[#064e3b]" />{item}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-[40px] border border-stone-100 shadow-sm overflow-hidden text-stone-800 text-center">
                                            <img src="https://bordigherasuite.com/wp-content/uploads/2024/06/20240604_163608-768x1024.jpg" className="w-full h-64 object-cover" />
                                            <div className="p-8 space-y-4">
                                                <h3 className="font-bold text-lg text-stone-900 leading-tight">Isola Ecologica</h3>
                                                <div className="w-full h-48 rounded-[32px] overflow-hidden map-shadow">
                                                    <iframe src="https://maps.google.com/maps?q=43.7829802884844,7.656043608039313&z=17&output=embed" className="w-full h-full border-none"></iframe>
                                                </div>
                                                <button onClick={() => triggerMaps("https://maps.app.goo.gl/2jsAx6V44kBaY3Hd9", "Isola Ecologica")} className="w-full py-4 bg-[#064e3b] text-white rounded-[24px] font-bold shadow-lg active:scale-95 transition-all uppercase tracking-wider text-xs">Apri Maps</button>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'extra-detail' && (
                                    <div className="space-y-6">
                                        <h2 className="font-serif text-3xl text-[#064e3b]">Accessori Extra</h2>
                                        <div className="bg-white p-8 rounded-[40px] border border-stone-100 shadow-sm space-y-6 text-stone-800">
                                            <p className="text-sm text-stone-600 leading-relaxed italic text-center">Dotazioni fornite esclusivamente su richiesta per garantire massimi spazi e ordine.</p>
                                            <div className="space-y-3">
                                                {['Tostapane', 'Microonde', 'Ferro e asse da stiro', 'Aspirapolvere', 'Culla e seggiolone', 'Caffettiera moka', 'Attrezzatura cucina'].map(item => (
                                                    <div key={item} className="flex items-center gap-4 p-4 bg-stone-50/50 rounded-2xl text-sm font-medium">
                                                        <Icon name="CheckCircle2" size={18} className="text-[#064e3b]" />{item}
                                                    </div>
                                                ))}
                                            </div>
                                            <button onClick={() => triggerWhatsApp("Buongiorno, è possibile avere degli accessori extra?")} className="w-full py-5 bg-[#064e3b] text-white rounded-[24px] font-bold flex items-center justify-center gap-3 shadow-lg active:scale-95 transition-all">Richiedi allo staff</button>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'checkout-detail' && (
                                    <div className="space-y-6">
                                        <h2 className="font-serif text-3xl text-[#064e3b]">Check-out</h2>
                                        <div className="bg-white p-8 rounded-[40px] border border-stone-100 shadow-sm space-y-8 text-stone-700">
                                            <div className="space-y-8 text-sm">
                                                <div className="flex gap-4"><Icon name="Clock" className="text-[#064e3b]" /> <p>Check-out previsto entro le ore <b>10:00</b>.</p></div>
                                                <div className="flex gap-4"><Icon name="Briefcase" className="text-[#064e3b]" /> <p>Deposito bagagli disponibile post-partenza su richiesta.</p></div>
                                                <div className="flex gap-4"><Icon name="Key" className="text-[#064e3b]" /> <p>Lasciare le chiavi sul tavolo e chiudete la porta.</p></div>
                                            </div>
                                            <button onClick={() => setShowReviewModal(true)} className="w-full py-5 bg-[#064e3b] text-white rounded-[24px] font-bold flex items-center justify-center gap-3 shadow-lg active:scale-95 transition-all">Lascia una recensione</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Navigation Bar */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 backdrop-blur-xl border-t border-stone-100 px-6 pt-4 pb-10 flex justify-between items-center z-[100]">
                        <button onClick={() => setActiveTab('explore')} className={`flex flex-col items-center gap-2 transition-colors ${['explore', 'restaurants-detail', 'alta-detail'].includes(activeTab) ? 'text-[#064e3b]' : 'text-stone-300'}`}>
                            <Icon name="MapPin" size={24} strokeWidth={2.5} />
                            <span className="text-[9px] font-bold uppercase tracking-widest text-center">ESPLORA</span>
                        </button>
                        <button onClick={() => setActiveTab('stays')} className={`flex flex-col items-center gap-2 transition-colors ${['stays', 'wifi-detail', 'waste-detail', 'extra-detail', 'checkout-detail'].includes(activeTab) ? 'text-[#064e3b]' : 'text-stone-300'}`}>
                            <Icon name="BookOpen" size={24} strokeWidth={2.5} />
                            <span className="text-[9px] font-bold uppercase tracking-widest text-center">SOGGIORNO</span>
                        </button>
                        <button onClick={() => setActiveTab('chat')} className={`flex flex-col items-center gap-2 transition-colors ${activeTab === 'chat' ? 'text-[#064e3b]' : 'text-stone-300'}`}>
                            <Icon name="MessageSquare" size={24} strokeWidth={2.5} />
                            <span className="text-[9px] font-bold uppercase tracking-widest text-center">CONCIERGE AI</span>
                        </button>
                        <button onClick={() => triggerWhatsApp("Buongiorno, vi contatto per assistenza.")} className="flex flex-col items-center gap-2 text-stone-300 active:text-[#064e3b]">
                            <Icon name="Phone" size={24} strokeWidth={2.5} />
                            <span className="text-[9px] font-bold uppercase tracking-widest text-center">STAFF</span>
                        </button>
                    </nav>

                    {/* Modal Conferma WhatsApp / Maps */}
                    {externalModal.show && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm fade-in">
                            <div className="bg-white rounded-[32px] p-8 w-full max-w-xs shadow-2xl text-center border border-stone-100">
                                <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6 ${externalModal.type === 'maps' ? 'bg-blue-100 text-blue-600' : 'bg-[#25D366]/10 text-[#25D366]'}`}>
                                    <Icon name={externalModal.type === 'maps' ? "Map" : "MessageCircle"} size={32} />
                                </div>
                                <h3 className="font-serif text-xl text-[#064e3b] mb-2 uppercase tracking-tight">{externalModal.title}</h3>
                                <p className="text-stone-500 text-sm mb-8 leading-relaxed italic text-center px-2">{externalModal.message}</p>
                                <div className="space-y-3">
                                    <button onClick={confirmExternal} className="w-full py-4 bg-[#064e3b] text-white rounded-2xl font-bold shadow-lg active:scale-95 transition-transform">Sì, procedi</button>
                                    <button onClick={() => setExternalModal({ ...externalModal, show: false })} className="w-full py-4 text-stone-400 font-bold uppercase text-xs tracking-widest">Annulla</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Recensione */}
                    {showReviewModal && (
                        <div className="fixed inset-0 z-[210] flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm fade-in">
                            <div className="bg-white rounded-[40px] p-8 w-full max-w-sm shadow-2xl overflow-y-auto max-h-[90vh] text-stone-800 text-center space-y-6">
                                <h3 className="font-serif text-2xl text-[#064e3b] leading-tight italic">Grazie per aver scelto Bordighera Suite Apartments</h3>
                                <div className="py-6 border-y border-stone-50 space-y-4">
                                    <p className="text-sm font-bold uppercase tracking-widest text-[#064e3b]">Ti sei trovato a tuo agio?</p>
                                    <div className="flex justify-center gap-1 text-orange-400 text-3xl leading-none py-2">{'★★★★★'}</div>
                                    <button onClick={() => window.open(googleReviewUrl, '_blank')} className="w-full py-5 bg-[#064e3b] text-white rounded-[24px] font-bold shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-2">
                                        <Icon name="CheckCircle2" size={18} /> Lascia 5 stelle su Google
                                    </button>
                                </div>
                                <div className="space-y-4 pt-4">
                                    <p className="text-xs font-bold text-stone-900 leading-tight">Qualcosa non è stato perfetto?</p>
                                    <button onClick={() => { triggerWhatsApp("Buongiorno, vorrei lasciarvi un feedback privato..."); setShowReviewModal(false); }} className="text-xs font-bold text-[#064e3b] underline uppercase tracking-widest active:opacity-50 transition-opacity">Inviaci un suggerimento privato</button>
                                </div>
                                <button onClick={() => setShowReviewModal(false)} className="text-stone-300 text-xs uppercase tracking-widest font-bold">Chiudi</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
